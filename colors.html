<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours</title>
    <style>
        h1 {
            color: #0BEE0B;
            /* above is hex colour code : this can be generated by rgb too 
            in rbg : red blue green amounts while in rgba : red green blue alpha: where 
            alpha is opacity : light /dark;*/
            /* HSL : h = hue represents type of colour
            S= saturation : intensity/purity
            l= lightness */


        }

        h2 {
            background-color: brown;
            color: hsl(67, 59%, 60%)
        }
    </style>
</head>

<body>
    <h1>Lets learn about colours</h1>
    <h2>HSL</h2>
    <p>colour can be represnted in </p>
    <ol>
        <li>colour keywords</li>
        <li>hex colour code</li>
        <li>RGB</li>
        <li>RGBA</li>
        <li>HSL</li>


    </ol>


</body>

</html>
