<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS </title>
    <style>
        div,
        span,
        h1 {
            color: blueviolet;
            background-color: antiquewhite;

        }
    </style>
</head>

<body>

    <h1>Ways to add css in html</h1>
    <div>
        <ol>
            <li>Inline CSS</li>
            <li> Use Style Tag / Internal css</li>
            <li>External css</li>

        </ol>
    </div>
    <span style="color:blueviolet;background-color: antiquewhite;">
        This line is styled using inline CSS
    </span>

</body>

</html>

<!--

ways to add css in html
1. inline css
2. style tag use 
3. external css


li tag : list item 
-->
