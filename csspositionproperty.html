<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
    <style>
        .box {
            border: 2px solid black;
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            padding: 0;
            box-sizing: border-box;
        }

        .box1 {
            background-color: aqua;
            position: sticky;
            height: 111px;
            margin: 0;
            top: 0px;
            width: 100%;
            padding: 0;
            /* position: absolute;
            top: 5px;
            left: 5px; */
        }

        .box2 {
            background-color: azure;
            position: relative;
            top: 34px;
            left: 56px;
        }

        .box3 {
            background-color: antiquewhite;
            position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 111px;

        }

        .box4 {
            background-color: purple;

        }

        .parent {
            /* transform, filter, or perspective properties can also make an element appear as positioned  */
            padding: 43px;
            margin: 34px;
            border: 3px solid indigo;


            /* so even when no positioned if filtered or perspective, transform is 
            there then parent will be considered positioned only and absolute will
            position itself relative to its parent not html  */
            transform: translate(0);
            filter: invert(0);

            position: absolute;



        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1 "></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>

</body>

</html>
